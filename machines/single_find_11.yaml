name: "single_find_11"
description: "Dizgi içinde '11' alt dizgisini deterministik (klasik) olarak arar."
states: [q_start, q_found_one, q_accept, q_reject]
input_alphabet: ["0", "1"]
tape_alphabet: ["0", "1", "B"]
blank: "B"
start_state: q_start
accept_states: [q_accept]
reject_states: [q_reject]
transitions:
  - {state: q_start, read: "0", next: q_start, write: "0", move: R}
  - {state: q_start, read: "1", next: q_found_one, write: "1", move: R}
  - {state: q_start, read: "B", next: q_reject, write: "B", move: R} 
  
  - {state: q_found_one, read: "0", next: q_start, write: "0", move: R}
  - {state: q_found_one, read: "1", next: q_accept, write: "1", move: R} 
  - {state: q_found_one, read: "B", next: q_reject, write: "B", move: R} 