name: "ntm_find_11"
description: "Dizgi içinde '11' alt dizgisini non-deterministic (BFS) olarak arar."
states: [q_start, q_guess_1, q_accept]
input_alphabet: ["0", "1"]
tape_alphabet: ["0", "1", "B"]
blank: "B"
start_state: q_start
accept_states: [q_accept]
reject_states: []
max_depth: 50
max_branches: 1000
transitions:
  # Normal ilerleme: 0 veya 1 görsen de sağa doğru okumaya devam et.
  - {state: q_start, read: "0", next: q_start, write: "0", move: R}
  - {state: q_start, read: "1", next: q_start, write: "1", move: R}
  - {state: q_start, read: "1", next: q_guess_1, write: "1", move: R}
  - {state: q_guess_1, read: "1", next: q_accept, write: "1", move: S}