name: "string_copy"
description: "Verilen dizgiyi (ör. ab) kopyalayarak arasına # koyar (ab#ab)."
states: [q_init, q_rewind_init, q_start_copy, q_find_end_a, q_find_end_b, q_return, q_restore, q_accept]
input_alphabet: ["a", "b"]
tape_alphabet: ["a", "b", "X", "Y", "#", "B"]
blank: "B"
start_state: q_init
accept_states: [q_accept]
reject_states: []
transitions:
  # AŞAMA 1: Kelimenin en sonuna gidip '#' ayırıcısını koy ve başa dön
  - {state: q_init, read: "a", next: q_init, write: "a", move: R}
  - {state: q_init, read: "b", next: q_init, write: "b", move: R}
  - {state: q_init, read: "B", next: q_rewind_init, write: "#", move: L}
  
  - {state: q_rewind_init, read: "a", next: q_rewind_init, write: "a", move: L}
  - {state: q_rewind_init, read: "b", next: q_rewind_init, write: "b", move: L}
  - {state: q_rewind_init, read: "B", next: q_start_copy, write: "B", move: R}
  
  # AŞAMA 2: Kopyalama Döngüsü (Harfi işaretle ve kurye gibi sona taşı)
  - {state: q_start_copy, read: "a", next: q_find_end_a, write: "X", move: R}
  - {state: q_start_copy, read: "b", next: q_find_end_b, write: "Y", move: R}
  - {state: q_start_copy, read: "#", next: q_restore, write: "#", move: L} # Kopyalanacak harf bitti!
  
  # 'a' harfini alıp en sağa bırakma
  - {state: q_find_end_a, read: "a", next: q_find_end_a, write: "a", move: R}
  - {state: q_find_end_a, read: "b", next: q_find_end_a, write: "b", move: R}
  - {state: q_find_end_a, read: "#", next: q_find_end_a, write: "#", move: R}
  - {state: q_find_end_a, read: "B", next: q_return, write: "a", move: L}
  
  # 'b' harfini alıp en sağa bırakma
  - {state: q_find_end_b, read: "a", next: q_find_end_b, write: "a", move: R}
  - {state: q_find_end_b, read: "b", next: q_find_end_b, write: "b", move: R}
  - {state: q_find_end_b, read: "#", next: q_find_end_b, write: "#", move: R}
  - {state: q_find_end_b, read: "B", next: q_return, write: "b", move: L}
  
  # İşaretli harfi (X veya Y) bulana kadar geri dön
  - {state: q_return, read: "a", next: q_return, write: "a", move: L}
  - {state: q_return, read: "b", next: q_return, write: "b", move: L}
  - {state: q_return, read: "#", next: q_return, write: "#", move: L}
  - {state: q_return, read: "X", next: q_start_copy, write: "X", move: R} # Sıradaki harfe geç
  - {state: q_return, read: "Y", next: q_start_copy, write: "Y", move: R} # Sıradaki harfe geç
  
  # AŞAMA 3: Temizlik (X ve Y'leri tekrar a ve b yap)
  - {state: q_restore, read: "X", next: q_restore, write: "a", move: L}
  - {state: q_restore, read: "Y", next: q_restore, write: "b", move: L}
  - {state: q_restore, read: "B", next: q_accept, write: "B", move: R}